  Simple key-value storage with collections, supporting Desktop, Web, and Mobile.
version: 1.2.0
repository: https://github.com/pparresia/work_db_dart
issue_tracker: https://github.com/pparresia/work_db_dart/issues
documentation: https://github.com/pparresia/work_db_dart#readme

